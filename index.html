			  <div class="item-name">${escapeHtml(it.name)}</div>

			  <button class="btn icon flat" data-action="item-gear" data-id="${it.id}" aria-label="Options article">${icon("gear")}</button>
			</div>
		  `;
		}).join("");

      appEl.innerHTML = `
        <div class="store-toolbar">
        <div class="store-header">
          <button class="btn icon" data-action="back-home" aria-label="Retour">${icon("back")}</button>
          <div class="store-title" title="${escapeAttr(store.name)}">${escapeHtml(store.name)}</div>
          <button class="btn icon" data-action="toggle-search" aria-label="Rechercher">${icon("search")}</button>
          <button class="btn icon" data-action="store-menu" aria-label="Menu">${icon("more")}</button>
        </div>

        <div class="meta-row">
          <div class="pill">Reste : <strong>${rest}</strong></div>
          <button class="btn icon primary" data-action="add-item" aria-label="Ajouter un article" title="Ajouter un article">${icon("plus")}</button>
          <button class="pill" data-action="toggle-filter-pill" aria-label="Basculer le filtre" style="cursor:pointer;">Filtre : <strong>${filterOn ? "ON" : "OFF"}</strong></button>
        </div>

        <div class="searchbar ${searchOpen ? "open" : ""}">
          <div class="field card">
            ${icon("search")}
            <input id="searchInput" type="text" placeholder="Rechercher un article" value="${escapeAttr(ui.searchQuery)}" />
            <button class="btn icon flat clear" data-action="clear-search" aria-label="Effacer">${icon("close")}</button>
          </div>
        </div>

        </div>

        <div class="list">
          ${itemsHtml || `<div class="empty">${filterOn || q ? "Rien ici (avec le filtre/recherche)." : "Aucun article. Ajoute-en un avec le +."}</div>`}
        </div>

      `;

      if (ui.searchOpen) {
        const input = $("#searchInput");
        if (input) setTimeout(() => input.focus(), 40);
      }
    }

    function getStore(storeId) {
      return appData.stores.find(s => s.id === storeId) || null;
    }
    function getItem(store, itemId) {
      return store.items.find(i => i.id === itemId) || null;
    }

    function openStore(storeId) {
      ui.screen = "store";
      ui.storeId = storeId;
      ui.searchOpen = false;
      ui.searchQuery = "";
      render();
    }

    /* ----------------------------
       Actions (clics)
    ---------------------------- */

    // désactive le menu contextuel iOS (sauf champs de texte)
    document.addEventListener("contextmenu", (e) => {
      if (e.target && e.target.closest("input, textarea")) return;
      e.preventDefault();
    });

    document.addEventListener("click", async (e) => {
      if (Date.now() < suppressClickUntil) {
        e.preventDefault();
        return;
      }
      const el = e.target.closest("[data-action]");
      if (!el) return;

      const action = el.dataset.action;
      const id = el.dataset.id;

      if (action === "toggle-theme") {
        pushUndo();
        appData.prefs.theme = (appData.prefs.theme === "dark") ? "light" : "dark";
        applyTheme(appData.prefs.theme);
        saveAppData();
        render();
        toast(appData.prefs.theme === "dark" ? "Mode sombre" : "Mode clair");
        return;
      }
	  
      if (action === "open-settings") {
        ui.screen = "settings";
        ui.storeId = null;
        ui.searchOpen = false;
        ui.searchQuery = "";
        render();
        return;
      }
	  
      if (action === "open-store") {
        openStore(id);
        return;
      }

      if (action === "back-home") {
        ui.screen = "home";
        ui.storeId = null;
        ui.searchOpen = false;
        ui.searchQuery = "";
        render();
        return;
      }

      if (action === "add-store") {
        const name = await showPrompt({
          title: "Nouveau magasin",
          label: "Nom du magasin",
          placeholder: "Ex : Mon magasin",
          okText: "Ajouter"
        });
        if (!name) return;

        pushUndo();
        appData.stores.push({
          id: uid("s_"),
          name,
          template: null,
          items: []
        });
        saveAppData();
        render();
        toast("Magasin ajouté");
        return;
      }

      if (action === "store-gear") {
        const store = getStore(id);
        if (!store) return;

        const choice = await showSheet({
          title: store.name,
          items: [
            { label: "Renommer", value: "rename" },
            { label: "Supprimer", value: "delete", danger: true },
            { label: "Annuler", value: "cancel" }
          ]
        });
        if (choice === "rename") {
          const newName = await showPrompt({
            title: "Renommer le magasin",
            label: "Nouveau nom",
            value: store.name,
            okText: "Renommer"
          });
          if (!newName) return;
          pushUndo();
          store.name = newName;
          saveAppData();
          render();
          toast("Magasin renommé");
        }
        if (choice === "delete") {
          const ok = await showConfirm({
            title: "Supprimer ce magasin ?",
            message: "Il disparaîtra avec tous ses articles.",
            okText: "Supprimer",
            danger: true
          });
          if (!ok) return;
          pushUndo();
          appData.stores = appData.stores.filter(s => s.id !== store.id);
          saveAppData();
          if (ui.storeId === store.id) {
            ui.screen = "home";
            ui.storeId = null;
          }
          render();
          toast("Magasin supprimé");
        }
        return;
      }

      if (action === "add-item") {
        const store = getStore(ui.storeId);
        if (!store) return;

        const name = await showPrompt({
          title: "Nouvel article",
          label: "Nom de l'article",
          placeholder: "Ex : Lait",
          okText: "Ajouter"
        });
        if (!name) return;

        pushUndo();
        store.items.push({
          id: uid("i_"),
          name,
          qty: 1,
          planned: true,
          bought: false
        });
        saveAppData();
        render();
        toast("Article ajouté");
        return;
      }

      if (action === "toggle-planned") {
        const store = getStore(ui.storeId);
        if (!store) return;
        const it = getItem(store, id);
        if (!it) return;

        pushUndo();
        it.planned = !it.planned;
        saveAppData();

        if (ui.filterOn && !it.planned) {
          animateRemoval(id);
        } else {
          render();
        }
        return;
      }

      if (action === "qty-inc" || action === "qty-dec") {
        const store = getStore(ui.storeId);
        if (!store) return;
        const it = getItem(store, id);
        if (!it) return;

        pushUndo();
        if (action === "qty-inc") it.qty = Math.min(99, (it.qty || 1) + 1);
        if (action === "qty-dec") it.qty = Math.max(1, (it.qty || 1) - 1);
        saveAppData();
        render();
        return;
      }

      if (action === "item-gear") {
        const store = getStore(ui.storeId);
        if (!store) return;
        const it = getItem(store, id);
        if (!it) return;

        const choice = await showSheet({
          title: it.name,
          items: [
            { label: "Renommer", value: "rename" },
            { label: "Supprimer", value: "delete", danger: true },
            { label: "Annuler", value: "cancel" }
          ]
        });

        if (choice === "rename") {
          const newName = await showPrompt({
            title: "Renommer l'article",
            label: "Nouveau nom",
            value: it.name,
            okText: "Renommer"
          });
          if (!newName) return;
          pushUndo();
          it.name = newName;
          saveAppData();
          render();
          toast("Article renommé");
        }

        if (choice === "delete") {
          const ok = await showConfirm({
            title: "Supprimer cet article ?",
            message: "Il disparaîtra de la liste.",
            okText: "Supprimer",
            danger: true
          });
          if (!ok) return;
          pushUndo();
          store.items = store.items.filter(x => x.id !== it.id);
          saveAppData();
          render();
          toast("Article supprimé");
        }
        return;
      }

      if (action === "toggle-search") {
        ui.searchOpen = !ui.searchOpen;
        if (!ui.searchOpen) ui.searchQuery = "";
        render();
        return;
      }

      if (action === "clear-search") {
        ui.searchQuery = "";
        render();
        return;
      }

      if (action === "toggle-filter-pill") {
        ui.filterOn = !ui.filterOn;
        render();
        toast(ui.filterOn ? "Filtre ON" : "Filtre OFF");
        return;
      }

      if (action === "store-menu") {
        const store = getStore(ui.storeId);
        if (!store) return;

        const canRestore = !!store.template && !!ORIGINAL_TEMPLATES[store.template];

        const choice = await showSheet({
          title: "Actions",
          items: [
            { label: "Undo", value: "undo", disabled: !undoStack.length, hint: undoStack.length ? `${undoStack.length}` : "—" },
            { label: ui.filterOn ? "Filtre : ON (désactiver)" : "Filtre : OFF (activer)", value: "filter" },
            { label: "Nouvelle course", value: "new" },
            { label: "Restaurer la liste d’origine", value: "restore", disabled: !canRestore },
            { label: "Annuler", value: "cancel" }
          ]
        });

        if (choice === "undo") {
          doUndo();
        }
        if (choice === "filter") {
          ui.filterOn = !ui.filterOn;
          render();
          toast(ui.filterOn ? "Filtre ON" : "Filtre OFF");
        }
        if (choice === "new") {
          const ok = await showConfirm({
            title: "Nouvelle course",
            message: "Remettre tous les articles en “pas prévu”. Les quantités restent.",
            okText: "OK"
          });
          if (!ok) return;
          pushUndo();
          for (const it of store.items) {
            it.planned = false;
          }
          saveAppData();
          render();
          toast("Nouvelle course");
        }
        if (choice === "restore") {
          const ok = await showConfirm({
            title: "Restaurer la liste d’origine ?",
            message: "Ça remplace toute la liste de ce magasin (articles + ordre).",
            okText: "Restaurer"
          });
          if (!ok) return;
          pushUndo();
          const names = ORIGINAL_TEMPLATES[store.template] || [];
          store.items = names.map(n => ({
            id: uid("i_"),
            name: n,
            qty: 1,
            planned: false,
            bought: false
          }));
          saveAppData();
          render();
          toast("Liste restaurée");
        }
        return;
      }

      if (action === "export") {
        exportToFile();
        return;
      }
      if (action === "import") {
        importFromFile();
        return;
      }
    });

    // recherche input
    document.addEventListener("input", (e) => {
      if (e.target && e.target.id === "searchInput") {
        ui.searchQuery = e.target.value || "";
        render();
      }
    });

    /* ----------------------------
       Export / Import
    ---------------------------- */
    async function exportToFile() {
      try {
        const exportedAt = nowISO();

        const d = new Date();
        const stamp = d.toISOString().slice(0,10);
        const filename = `Courses-${stamp}.json`;

        const payload = JSON.stringify({ exportedAt, appData }, null, 2);
        const blob = new Blob([payload], { type: "application/json" });

        // iPhone : propose "Enregistrer dans Fichiers" via Partager
        let done = false;
        if (navigator.share && navigator.canShare) {
          try {
            const file = new File([blob], filename, { type: "application/json" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: "Sauvegarde Liste de courses" });
              done = true;
            }
          } catch (err) {
            // Annulé = on ne fait rien
            if (err && err.name === "AbortError") {
              toast("Sauvegarde annulée");
              return;
            }
            // sinon, on tombera sur le téléchargement
          }
        }

        if (!done) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 800);
          done = true;
        }

        if (done) {
          appData.lastBackupISO = exportedAt;
          saveAppData();
          render();
          toast("Sauvegarde créée");
        }
      } catch {
        toast("Sauvegarde impossible");
      }
    }

    function importFromFile() {
      const input = $("#fileInput");
      if (!input) return;
      input.value = "";
      input.onchange = async () => {
        if (!input.files || !input.files.length) return;
        const file = input.files[0];

        const ok = await showConfirm({
          title: "Restaurer ?",
          message: "Ça remplace tes données actuelles.",
          okText: "Restaurer"
        });
        if (!ok) return;

        try {
          const text = await file.text();
          const obj = JSON.parse(text);

          const incoming = obj && obj.appData;
          if (!incoming || incoming.schemaVersion !== SCHEMA_VERSION || !Array.isArray(incoming.stores)) {
            toast("Fichier invalide");
            return;
          }

          pushUndo();
          appData = incoming;
          appData.prefs = appData.prefs || {};
          appData.prefs.theme = appData.prefs.theme || pickInitialTheme();
          applyTheme(appData.prefs.theme);
          saveAppData();

          ui.screen = "home";
          ui.storeId = null;
          ui.searchOpen = false;
          ui.searchQuery = "";
          render();
          toast("Restauration OK");
        } catch {
          toast("Restauration impossible");
        }
      };
      toast("Choisis le fichier de sauvegarde (.json)");
      input.click();
    }

    /* ----------------------------
       Animation disparition (filtre actif)
    ---------------------------- */
    function animateRemoval(itemId) {
      const row = document.querySelector(`[data-item-row="${cssEscape(itemId)}"]`);
      if (!row) {
        render();
        return;
      }

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        row.removeEventListener("transitionend", onEnd);
        render();
      };

      const onEnd = (ev) => {
        if (ev && ev.target !== row) return;
        finish();
      };

      row.addEventListener("transitionend", onEnd);
      row.classList.add("removing");

      // Filet de sécurité si transitionend ne remonte pas sur un device.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (!done && !row.isConnected) finish();
        });
      });
    }

    function cssEscape(s) {
      // Nos IDs sont "safe" (lettres/chiffres/_/-). Pas besoin de gymnastique.
      return (s || "").toString();
    }

/* ----------------------------
       Swipe gauche/droite entre magasins
    ---------------------------- */
    let swipe = null;

    document.addEventListener("touchstart", (e) => {
      if (ui.screen !== "store") return;
	  if (e.target.closest(".checkbox, .stepper, .btn, .handle, .searchbar, .modalOverlay, .item-row, .store-row")) return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      swipe = { x: t.clientX, y: t.clientY, time: Date.now() };
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!swipe || ui.screen !== "store") return;
      const t = e.touches && e.touches[0];
      if (!t) return;
      const dx = t.clientX - swipe.x;
      const dy = t.clientY - swipe.y;
      if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) + 6) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener("touchend", (e) => {
      if (!swipe || ui.screen !== "store") return;
      const t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - swipe.x;
      const dy = t.clientY - swipe.y;
      const dt = Date.now() - swipe.time;
      swipe = null;

      if (Math.abs(dy) > 80) return;
      if (dt > 450) return;

      if (dx > 60) {
        moveToAdjacentStore(-1);
      } else if (dx < -60) {
        moveToAdjacentStore(1);
      }
    }, { passive: true });

    function moveToAdjacentStore(delta) {
      const idx = appData.stores.findIndex(s => s.id === ui.storeId);
      if (idx < 0) return;
      const next = appData.stores[idx + delta];
      if (!next) return;
      ui.storeId = next.id;
      ui.searchOpen = false;
      ui.searchQuery = "";
      render();
    }

    /* ----------------------------
       Déplacement tactile (magasins + articles)
    ---------------------------- */
    let listSorter = null;
    let reorderSession = null;
    let reorderCancelled = false;

    function disposeReordering() {
      const sorter = listSorter;
      const session = reorderSession;
      stopReorderScrolling(session);
      listSorter = null;
      reorderCancelled = true;
      if (sorter) sorter.destroy();
      document.querySelectorAll(".drag-preview").forEach(el => el.remove());
      appEl.querySelectorAll(".drag-chosen, .drag-placeholder").forEach(el => {
        el.classList.remove("drag-chosen", "drag-placeholder");
        el.style.willChange = "";
      });
      document.body.classList.remove("is-reordering");
      if (session && (session.touch || session.started)) suppressClickUntil = Date.now() + 350;
      reorderSession = null;
    }

    function cancelReordering() {
      if (!listSorter || (!reorderSession && !Sortable.dragged)) return;
      disposeReordering();
      // Le modèle n'est modifié qu'au relâchement réussi : render restaure l'ordre initial.
      render();
    }

    function saveReorderedRows(session, visibleIds) {
      if (visibleIds.length !== session.visibleIds.length ||
          new Set(visibleIds).size !== visibleIds.length ||
          visibleIds.some(id => !session.visibleIds.includes(id))) return false;
      const store = session.type === "item" ? getStore(session.storeId) : null;
      const rows = session.type === "store" ? appData.stores : store?.items;
      if (!rows) return false;
      const byId = new Map(rows.map(row => [row.id, row]));
      if (visibleIds.some(id => !byId.has(id))) return false;
      const visible = new Set(visibleIds);
      let next = 0;
      // En recherche/filtre, les éléments masqués conservent exactement leur place.
      const reordered = rows.map(row => visible.has(row.id) ? byId.get(visibleIds[next++]) : row);
      if (!reordered.some((row, i) => row.id !== rows[i].id)) return false;
      pushUndo();
      if (session.type === "store") appData.stores = reordered;
      else store.items = reordered;
      saveAppData();
      return true;
    }

    function setupReordering() {
      if (ui.screen !== "home" && ui.screen !== "store") return;
      const type = ui.screen === "home" ? "store" : "item";
      const selector = type === "store" ? ".store-row" : ".item-row";
      const container = appEl.querySelector(".list");
      if (!container || container.querySelectorAll(selector).length < 2) return;
      const idAttribute = type === "store" ? "data-row-store" : "data-item-row";
      const ids = () => Array.from(container.querySelectorAll(selector), row => row.getAttribute(idAttribute));
      reorderCancelled = false;
      const sorter = new Sortable(container, {
        draggable: selector,
        dataIdAttr: idAttribute,
        direction: "vertical",
        delay: 320,
        delayOnTouchOnly: true,
        touchStartThreshold: 8,
        fallbackTolerance: 3,
        forceFallback: true,
        fallbackOnBody: true,
        supportPointer: false,
        animation: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 160,
        easing: "cubic-bezier(.2,.8,.2,1)",
        ghostClass: "drag-placeholder",
        chosenClass: "drag-chosen",
        fallbackClass: "drag-preview",
        dragClass: "drag-moving",
        scroll: false,
        preventOnFilter: false,
        filter(event) {
          return Boolean(event.touches?.length > 1 || event.target.closest(
            '.stepper, [data-action="store-gear"], [data-action="item-gear"], input, textarea'
          ));
        },
        onChoose(event) {
          reorderCancelled = false;
          const point = event.originalEvent?.touches?.[0] || event.originalEvent;
          const rect = event.item.getBoundingClientRect();
          reorderSession = { owner: sorter, type, storeId: ui.storeId, visibleIds: ids(),
            touch: Boolean(event.originalEvent?.touches), started: false,
            point: point ? { x: point.clientX, y: point.clientY } : null,
            offset: point ? { x: point.clientX - rect.left, y: point.clientY - rect.top } : null,
            preview: null, previewTop: 0, previewLeft: 0, autoRaf: 0, lastFrame: 0 };
          swipe = null;
          if (reorderSession.touch) suppressClickUntil = Infinity;
        },
        onStart() {
          if (reorderSession) {
            const session = reorderSession;
            session.started = true;
            session.preview = document.querySelector(".drag-preview");
            if (session.preview) {
              session.previewTop = parseFloat(session.preview.style.top) || 0;
              session.previewLeft = parseFloat(session.preview.style.left) || 0;
              session.preview.setAttribute("aria-hidden", "true");
            }
            session.lastFrame = performance.now();
            session.autoRaf = requestAnimationFrame(now => scrollReorderFrame(session, now));
          }
          suppressClickUntil = Infinity;
          document.body.classList.add("is-reordering");
        },
        onUnchoose() {
          stopReorderScrolling(reorderSession);
          document.body.classList.remove("is-reordering");
          if (reorderSession && (reorderSession.touch || reorderSession.started)) {
            suppressClickUntil = Date.now() + 350;
          }
          queueMicrotask(() => {
            if (reorderSession?.owner === sorter && !Sortable.dragged) reorderSession = null;
          });
        },
        onEnd(event) {
          const session = reorderSession;
          stopReorderScrolling(session);
          reorderSession = null;
          suppressClickUntil = Date.now() + 350;
          document.body.classList.remove("is-reordering");
          const cancel = reorderCancelled || event.originalEvent?.type === "touchcancel";
          const changed = !cancel && session ? saveReorderedRows(session, ids()) : false;
          // Le composant doit finir son nettoyage avant de reconstruire la liste.
          queueMicrotask(() => {
            if (listSorter !== sorter) return;
            render();
            if (changed) toast("Ordre mis à jour");
          });
        },
      });
      listSorter = sorter;
    }

    function stopReorderScrolling(session) {
      if (session?.autoRaf) cancelAnimationFrame(session.autoRaf);
      if (session) session.autoRaf = 0;
    }

    function scrollReorderFrame(session, now) {
      if (session !== reorderSession || session.owner !== listSorter || !session.started) return;
      const y = session.point?.y;
      const dt = Math.min(40, Math.max(0, now - session.lastFrame));
      session.lastFrame = now;
      if (typeof y === "number") {
        const toolbarBottom = appEl.querySelector(".store-toolbar")?.getBoundingClientRect().bottom || 0;
        const viewport = window.visualViewport;
        const visibleTop = viewport?.offsetTop || 0;
        const visibleHeight = viewport?.height || window.innerHeight;
        const top = Math.max(visibleTop, Math.min(toolbarBottom, visibleTop + visibleHeight / 2));
        const appStyle = getComputedStyle(appEl);
        const bottomInset = Math.max(0, parseFloat(appStyle.paddingBottom) - parseFloat(appStyle.paddingLeft));
        const bottom = visibleTop + visibleHeight - bottomInset;
        const speed = y < top + 64 ? -250 * clamp((top + 64 - y) / 64, 0, 1)
          : y > bottom - 64 ? 250 * clamp((y - (bottom - 64)) / 64, 0, 1) : 0;
        if (speed) window.scrollBy(0, speed * dt / 1000);
        // Sur iOS la copie est positionnée dans le document : elle doit rester sous le doigt
        // même quand la page défile sans nouveau mouvement tactile.
        if (session.preview?.isConnected && session.offset) {
          const rect = session.preview.getBoundingClientRect();
          const dx = session.point.x - session.offset.x - rect.left;
          const dy = session.point.y - session.offset.y - rect.top;
          if (Math.abs(dx) > .1) session.preview.style.left = (parseFloat(session.preview.style.left) + dx) + "px";
          if (Math.abs(dy) > .1) session.preview.style.top = (parseFloat(session.preview.style.top) + dy) + "px";
        }
      }
      session.autoRaf = requestAnimationFrame(next => scrollReorderFrame(session, next));
    }

    function adjustReorderScroll(event) {
      if (!listSorter || !reorderSession) return;
      const point = event.touches?.[0] || event;
      if (typeof point.clientY !== "number") return;
      reorderSession.point = { x: point.clientX, y: point.clientY };
      // Rendre au composant son origine avant son calcul du prochain mouvement.
      if (reorderSession.preview?.isConnected) {
        reorderSession.preview.style.top = reorderSession.previewTop + "px";
        reorderSession.preview.style.left = reorderSession.previewLeft + "px";
      }
    }
    document.addEventListener("touchmove", adjustReorderScroll, { passive: true, capture: true });
    document.addEventListener("mousemove", adjustReorderScroll, { passive: true, capture: true });
    window.addEventListener("touchcancel", () => { reorderCancelled = true; }, { passive: true, capture: true });
    window.addEventListener("touchstart", event => {
      if (event.touches.length > 1) cancelReordering();
    }, { passive: true, capture: true });
    window.addEventListener("blur", cancelReordering);
    window.addEventListener("pagehide", cancelReordering);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") cancelReordering();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && reorderSession) cancelReordering();
    });

    /* ----------------------------
       Boot
    ---------------------------- */
    render();

    const splashEl = document.getElementById("splash");
    let splashDone = false;
    const enterApp = () => {
      if (splashDone) return;
      splashDone = true;
      // revient toujours à l’accueil au démarrage
      ui.screen = "home";
      ui.storeId = null;
      ui.searchOpen = false;
      ui.searchQuery = "";
      document.body.classList.add("entered");
      if (splashEl) splashEl.setAttribute("aria-hidden", "true");
      render();
    };

	if (splashEl) {
	  const onSplash = (e) => {
		if (e && e.preventDefault) e.preventDefault();
		enterApp();
	  };
	  splashEl.addEventListener("pointerdown", onSplash, { passive: false });
	  splashEl.addEventListener("click", onSplash, { passive: false });
	}

    window.addEventListener("load", () => {
      setTimeout(() => {
        document.body.classList.remove("loading");
        document.body.classList.add("ready");
      }, 320);
    });

  })();
  </script>
</body>
</html>
